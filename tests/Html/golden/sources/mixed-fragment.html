<!DOCTYPE html><html><head><title>fragment</title></head><body><style>@import url("https://fonts.bunny.net/css2?family=Roboto&display=swap");
@font-face{font-family:"Inter";src:url("fonts/Inter-Regular.ttf") format("truetype");font-weight:400;font-style:normal}
@font-face{font-family:"Inter";src:url("fonts/Inter-Italic.ttf") format("truetype");font-weight:400;font-style:italic}
@font-face{font-family:"Inter";src:url("fonts/Inter-Bold.ttf") format("truetype");font-weight:700;font-style:normal}
@font-face{font-family:"Inter";src:url("fonts/Inter-BoldItalic.ttf") format("truetype");font-weight:700;font-style:italic}
.papercut{background:#e5e7eb;padding:24px 0}
.papercut *,.papercut *::before,.papercut *::after{box-sizing:border-box}
.papercut p,.papercut h1,.papercut h2,.papercut h3,.papercut h4{margin:0;font:inherit;overflow-wrap:anywhere}
.papercut a{color:inherit;text-decoration:inherit}
.papercut img{display:block;max-width:100%}
.papercut table{border-collapse:collapse;table-layout:fixed;width:100%}
.papercut td,.papercut th{vertical-align:top;text-align:inherit;font-weight:inherit}
.papercut .pc-page{position:relative;z-index:0;margin:0 auto 24px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.papercut .pc-header,.papercut .pc-body,.papercut .pc-footer,.papercut .pc-background{display:flex;flex-direction:column;align-items:stretch}
.papercut .pc-background{position:absolute;inset:0;z-index:-1}
.papercut .pc-break{break-before:page}
@media print{.papercut{background:none;padding:0}.papercut .pc-page{max-width:none;min-height:0;margin:0;padding:0;box-shadow:none;break-after:page}.papercut tr{break-inside:avoid}}</style><div class="papercut" style="font-family:&quot;Inter&quot;, system-ui, sans-serif;font-size:10pt;font-weight:400;font-style:normal;color:#0f172a;line-height:1.4;letter-spacing:0pt;text-align:left;text-decoration:none"><section class="pc-page" style="max-width:595.28pt;min-height:841.89pt;padding:56.693pt 56.693pt 56.693pt 56.693pt"><div class="pc-body"><p>Hello Inter</p><p style="font-family:&quot;Roboto&quot;, system-ui, sans-serif">Hello Roboto</p></div></section></div></body></html>
