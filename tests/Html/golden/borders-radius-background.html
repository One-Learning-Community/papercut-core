<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title></title><style>.papercut{background:#e5e7eb;padding:24px 0}
.papercut *,.papercut *::before,.papercut *::after{box-sizing:border-box}
.papercut p,.papercut h1,.papercut h2,.papercut h3,.papercut h4{margin:0;font:inherit;overflow-wrap:anywhere}
.papercut a{color:inherit;text-decoration:inherit}
.papercut img{display:block;max-width:100%}
.papercut table{border-collapse:collapse;table-layout:fixed;width:100%}
.papercut td,.papercut th{vertical-align:top;text-align:inherit;font-weight:inherit}
.papercut .pc-page{position:relative;z-index:0;margin:0 auto 24px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.papercut .pc-header,.papercut .pc-body,.papercut .pc-footer,.papercut .pc-background{display:flex;flex-direction:column;align-items:stretch}
.papercut .pc-background{position:absolute;inset:0;z-index:-1}
.papercut .pc-break{break-before:page}
@page{size:419.53pt 595.28pt;margin:34.016pt 34.016pt 34.016pt 34.016pt}
@media print{.papercut{background:none;padding:0}.papercut .pc-page{max-width:none;min-height:0;margin:0;padding:0;box-shadow:none;break-after:page}.papercut tr{break-inside:avoid}}</style></head><body><div class="papercut" style="font-family:&quot;Inter&quot;, system-ui, sans-serif;font-size:10pt;font-weight:400;font-style:normal;color:#0f172a;line-height:1.4;letter-spacing:0pt;text-align:left;text-decoration:none"><section class="pc-page" style="max-width:419.53pt;min-height:595.28pt;padding:34.016pt 34.016pt 34.016pt 34.016pt"><div class="pc-body"><div style="display:flex;flex-direction:column;gap:10pt"><p style="padding:10pt 10pt 10pt 10pt;border-width:1pt 1pt 1pt 1pt;border-style:solid;border-color:#334155">Plain border</p><p style="padding:10pt 10pt 10pt 10pt;border-width:1.5pt 1.5pt 1.5pt 1.5pt;border-style:solid;border-color:#4f46e5;border-radius:10pt;background:#e0e7ff">Radius and background</p><p style="padding:10pt 10pt 10pt 10pt;background:#fef3c7">Background only</p><p style="padding:6pt 6pt 6pt 6pt;border-width:0pt 0pt 2pt 0pt;border-style:solid;border-color:#f43f5e">Bottom rule</p><p style="padding:10pt 10pt 10pt 10pt;border-radius:4pt;background:#10b981;opacity:0.5;color:#ffffff">Half opacity</p><div style="display:flex;flex-direction:row;gap:8pt"><p style="padding:8pt 8pt 8pt 8pt;border-radius:16pt;background:#e0f2fe;flex:1 1 auto">One</p><p style="padding:8pt 8pt 8pt 8pt;border-width:1pt 1pt 1pt 1pt;border-style:solid;border-color:#0284c7;background:#bae6fd;flex:1 1 auto">Two</p></div></div></div></section></div></body></html>
